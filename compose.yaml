services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=wallet_db'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=anfield6CL'
    ports:
      - '5432'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
