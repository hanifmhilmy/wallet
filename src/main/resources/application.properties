spring.application.name=wallet

spring.devtools.add-properties=false

server.port=5555

spring.datasource.url=jdbc:postgresql://postgres:5432/wallet_db
spring.datasource.username=${POSTGRES_USER:-postgres}
spring.datasource.password=${POSTGRES_PASSWORD:-anfield6CL}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:postgresql://postgres:5432/wallet_db
spring.flyway.user=${POSTGRES_USER:-postgres}
spring.flyway.password=${POSTGRES_PASSWORD:-anfield6CL}

